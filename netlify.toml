[build]
  # Build the playground (Vite root is "playground/", outputs to "dist-site/")
  command = "npm run build:site"
  publish = "dist-site"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — Vite playground is a single-page app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
